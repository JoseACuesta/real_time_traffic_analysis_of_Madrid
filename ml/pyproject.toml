[project]
name = "ml"
version = "0.1.0"
description = "ML package"
authors = [
    { name = "Jose", email = "jacbj42@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "minio>=7.2.15",
    "onnxmltools>=1.14.0",
    "onnxruntime>=1.22.0",
    "pandas>=2.3.0",
    "polars>=1.31.0",
    "pyarrow>=20.0.0",
    "ruff>=0.12.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.16.0",
    "skl2onnx>=1.19.1",
    "xgboost>=3.0.4",
]

[tool.hatch.version]
path = "src/ml/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
