services:
  minio-service:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin    
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address "0.0.0.0:9001" --address "0.0.0.0:9000"
    volumes:
      - ./ml/src/ml:/data

  mc:
    image: minio/mc
    depends_on:
      - minio-service
    entrypoint: >
      /bin/sh -c "
        sleep 5 &&
        mc alias set local http://minio-service:9000 minioadmin minioadmin &&
        mc mb local/randomforestregressor || true &&
        mc mb local/xgboostregressor || true
      "
      
  frontend-service:
    build:
      context: ./plot-streaming-data
      dockerfile: Dockerfile
    command: streamlit run homepage.py 
    ports:
      -  "8501:8501"
    volumes:
      - ./plot-streaming-data/src/plot_streaming_data:/data